<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfeaff"/>
      <stop offset="100%" stop-color="#2b7fb8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6cf9c"/>
      <stop offset="100%" stop-color="#d4b16a"/>
    </linearGradient>
  </defs>

  <!-- water -->
  <rect x="0" y="0" width="800" height="320" fill="url(#water)"/>

  <!-- sand -->
  <path d="M0,290 Q100,270 200,290 T400,290 T600,290 T800,290 L800,320 L0,320 Z" fill="url(#sand)"/>

  <!-- bubbles -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="300" r="4">
      <animate attributeName="cy" from="300" to="10" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.6;0" keyTimes="0;0.7;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="300" r="3">
      <animate attributeName="cy" from="300" to="10" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.6;0" keyTimes="0;0.7;1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="300" r="5">
      <animate attributeName="cy" from="300" to="10" dur="4.6s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.6;0" keyTimes="0;0.7;1" dur="4.6s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="300" r="3.5">
      <animate attributeName="cy" from="300" to="10" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.6;0" keyTimes="0;0.7;1" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="300" r="4.5">
      <animate attributeName="cy" from="300" to="10" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.6;0" keyTimes="0;0.7;1" dur="4.2s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- seaweed -->
  <g stroke="#2e8b57" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M80,290 Q70,250 85,210" transform-origin="80 290">
      <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M150,290 Q160,240 145,195" transform-origin="150 290">
      <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <path d="M660,290 Q650,245 665,205" transform-origin="660 290">
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="2.9s" repeatCount="indefinite"/>
    </path>
    <path d="M730,290 Q740,235 725,190" transform-origin="730 290">
      <animateTransform attributeName="transform" type="rotate" values="5;-5;5" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- fish 1: orange, big loop -->
  <g>
    <g id="fish1">
      <polygon points="-18,0 -30,-9 -30,9" fill="#ff8c42">
        <animateTransform attributeName="transform" type="rotate" values="10;-10;10" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      </polygon>
      <ellipse cx="0" cy="0" rx="20" ry="11" fill="#ff9f5a"/>
      <circle cx="12" cy="-3" r="2.5" fill="#fff"/>
      <circle cx="13" cy="-3" r="1.2" fill="#222"/>
    </g>
    <animateMotion dur="26s" repeatCount="indefinite" rotate="auto" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.167;0.333;0.5;0.667;0.833;1"
      path="M120,120 C260,60 420,60 560,120 C680,170 680,190 560,200 C420,240 260,240 120,200 C40,170 40,150 120,120 Z"/>
  </g>

  <!-- fish 2: teal, mid loop -->
  <g>
    <g id="fish2">
      <polygon points="-14,0 -24,-7 -24,7" fill="#0fb5ae">
        <animateTransform attributeName="transform" type="rotate" values="9;-9;9" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      </polygon>
      <ellipse cx="0" cy="0" rx="16" ry="9" fill="#1fc9c1"/>
      <circle cx="9" cy="-2" r="2" fill="#fff"/>
      <circle cx="10" cy="-2" r="1" fill="#222"/>
    </g>
    <animateMotion dur="20s" repeatCount="indefinite" rotate="auto" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.167;0.333;0.5;0.667;0.833;1"
      path="M600,90 C500,50 300,50 200,90 C130,120 130,140 200,160 C300,190 500,190 600,160 C660,140 660,120 600,90 Z"/>
  </g>

  <!-- fish 3: pink, small quick loop -->
  <g>
    <g id="fish3">
      <polygon points="-10,0 -18,-5 -18,5" fill="#ff6fa8">
        <animateTransform attributeName="transform" type="rotate" values="11;-11;11" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      </polygon>
      <ellipse cx="0" cy="0" rx="12" ry="6.5" fill="#ff8fbd"/>
      <circle cx="7" cy="-1.5" r="1.6" fill="#fff"/>
      <circle cx="7.6" cy="-1.5" r="0.8" fill="#222"/>
    </g>
    <animateMotion dur="17s" repeatCount="indefinite" rotate="auto" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" keyTimes="0;0.167;0.333;0.5;0.667;0.833;1"
      path="M250,230 C330,200 470,200 550,230 C590,245 590,255 550,265 C470,285 330,285 250,265 C210,255 210,245 250,230 Z"/>
  </g>

  <!-- jellyfish: translucent, pulsing bell + swaying tentacles -->
  <g opacity="0.75">
    <g id="jelly1">
      <g>
        <path d="M-22,0 Q-22,-26 0,-26 Q22,-26 22,0 Q11,6 0,3 Q-11,6 -22,0 Z" fill="#e0a3ff">
          <animateTransform attributeName="transform" type="scale" values="1,1;1,0.82;1,1" dur="1.8s" repeatCount="indefinite" additive="sum"/>
        </path>
      </g>
      <g stroke="#e0a3ff" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M-14,4 Q-16,20 -12,36" transform-origin="-14 4">
          <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="2.2s" repeatCount="indefinite"/>
        </path>
        <path d="M-5,6 Q-6,24 -3,42" transform-origin="-5 6">
          <animateTransform attributeName="transform" type="rotate" values="7;-7;7" dur="1.9s" repeatCount="indefinite"/>
        </path>
        <path d="M5,6 Q6,24 3,42" transform-origin="5 6">
          <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="2.1s" repeatCount="indefinite"/>
        </path>
        <path d="M14,4 Q16,20 12,36" transform-origin="14 4">
          <animateTransform attributeName="transform" type="rotate" values="8;-8;8" dur="2.4s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    <animateMotion dur="16s" repeatCount="indefinite"
      path="M100,80 C180,140 60,200 130,240 C190,270 90,150 100,80 Z"/>
  </g>

  <g opacity="0.65">
    <g id="jelly2" transform="scale(0.7)">
      <g>
        <path d="M-22,0 Q-22,-26 0,-26 Q22,-26 22,0 Q11,6 0,3 Q-11,6 -22,0 Z" fill="#ffd6ec">
          <animateTransform attributeName="transform" type="scale" values="1,1;1,0.8;1,1" dur="1.6s" repeatCount="indefinite" additive="sum"/>
        </path>
      </g>
      <g stroke="#ffd6ec" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M-14,4 Q-16,20 -12,36" transform-origin="-14 4">
          <animateTransform attributeName="transform" type="rotate" values="8;-8;8" dur="1.7s" repeatCount="indefinite"/>
        </path>
        <path d="M-5,6 Q-6,24 -3,42" transform-origin="-5 6">
          <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M5,6 Q6,24 3,42" transform-origin="5 6">
          <animateTransform attributeName="transform" type="rotate" values="7;-7;7" dur="1.8s" repeatCount="indefinite"/>
        </path>
        <path d="M14,4 Q16,20 12,36" transform-origin="14 4">
          <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="2.3s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
    <animateMotion dur="13s" repeatCount="indefinite"
      path="M600,60 C660,110 720,90 700,150 C680,210 630,170 600,220 C570,170 620,110 600,60 Z"/>
  </g>
</svg>
